services:
  # 1. FastAPI Backend Service (Port 8000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: multi-agent-backend:latest
    container_name: multi-agent-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env

  # 2. React / Nginx Frontend Service (Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: multi-agent-frontend:latest
    container_name: multi-agent-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
