name: CI - Code Quality, Security Scanner & Pytest Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Run Linters, Bandit Security & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Code Quality Inspection (Ruff)
        run: |
          ruff check backend/app

      - name: 2. Code Formatting Check (Black)
        run: |
          black --check backend/app

      - name: 3. Static Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll

      - name: 4. Execute Pytest Test Suite
        run: |
          pytest backend/tests -v
