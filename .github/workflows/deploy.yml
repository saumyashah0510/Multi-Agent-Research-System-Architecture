name: CD - Automated AWS Cloud Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-aws:
    name: Build & Deploy Container Stack to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure AWS EC2 Server is Running
        run: |
          echo "Checking EC2 Instance state..."
          INSTANCE_STATE=$(aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Current EC2 Instance State: $INSTANCE_STATE"

          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "Instance is stopped. Starting EC2 Instance..."
            aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            echo "EC2 Instance is now RUNNING!"
          fi

      - name: SSH Deploy & Restart Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          timeout: 60s
          script: |
            set -euo pipefail

            # Ensure swap space is active on EC2 to prevent OOM kills during Docker builds
            if sudo -n true 2>/dev/null && [ $(swapon --show | wc -l) -le 1 ]; then
              echo "Configuring 2G swap space for Docker build stability..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap space successfully configured!"
            fi

            if [ ! -d "/home/ubuntu/app" ]; then
              git clone https://github.com/saumyashah0510/Multi-Agent-Research-System-Architecture.git /home/ubuntu/app
            fi
            cd /home/ubuntu/app
            git pull origin main
            if [ ! -f "/home/ubuntu/app/.env" ]; then
              cp /home/ubuntu/app/.env.example /home/ubuntu/app/.env
            fi
            docker compose up --build -d
            echo "DEPLOYMENT COMPLETE! Application running cleanly on EC2!"
